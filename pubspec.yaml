name: linh_kien_shop
description: "App bán linh kiện và thiết bị máy tính, laptop."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.7

  # Google Sign-In
  google_sign_in: ^6.2.2

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  shared_preferences: ^2.3.2

  # Navigation
  go_router: ^14.8.1

  # UI & utilities
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  image_cropper: ^9.0.0
  http: ^1.2.0
  intl: ^0.20.2
  flutter_slidable: ^3.1.0
  badges: ^3.1.2
  shimmer: ^3.0.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geocoding: ^4.0.0
  geolocator: ^13.0.0
  flutter_svg: ^2.3.0

  # Payment (VNPay sandbox): official webview + tự ký HMAC-SHA512.
  # Không dùng package vnpay_flutter vì nó kéo theo webview plugin cũ vỡ build AGP 8.
  webview_flutter: ^4.0.0
  crypto: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/brands/
    - assets/images/categories/
    - assets/icons/
    - assets/config/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
